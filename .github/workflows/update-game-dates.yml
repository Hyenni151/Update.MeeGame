
name: Update game dates

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - scripts/stamp_game_dates.py
      - .github/workflows/update-game-dates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update game dates
        run: python scripts/stamp_game_dates.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update game added dates"
          git push
