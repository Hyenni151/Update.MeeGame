name: Stamp dates for newly added MeeGame links

on:
  push:
    paths:
      - "index.html"
      - "scripts/stamp_game_dates.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Add dates to new game cards
        run: python scripts/stamp_game_dates.py

      - name: Commit updated dates when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No new game links need dates."
          else
            git add index.html
            git commit -m "chore: stamp dates for newly added games"
            git push
          fi
